<div class="bg-white rounded-3xl shadow-2xl p-10">
    <div class="text-center mb-8">
        <div class="inline-flex items-center gap-3 mb-6">
            <i class="fas fa-laptop text-5xl text-blue-600"></i>
            <h1 class="text-4xl font-bold text-gray-800">ICTTrack</h1>
        </div>
        <h2 class="text-2xl font-semibold mb-2">Welcome Back</h2>
        <p class="text-gray-600">Sign in to ICTTrack System</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-2xl mb-6">
                Invalid username or password
            </div>
        {% endif %}

        <div class="mb-6">
            <label class="block text-sm font-medium mb-2">Username</label>
            {{ form.username }}
        </div>

        <div class="mb-8">
            <label class="block text-sm font-medium mb-2">Password</label>
            {{ form.password }}
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-semibold text-lg transition">
            Login
        </button>
    </form>

    <div class="text-center mt-8">
        <p class="text-gray-600">
            Don't have an account? 
            <a href="{% url 'register' %}" class="text-blue-600 hover:underline font-medium">
                Register here
            </a>
        </p>
    </div>

    
</div>
