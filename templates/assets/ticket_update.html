{% extends 'assets/base.html' %}
{% block title %}Update Ticket #{{ ticket.id }}{% endblock %}
{% block header %}Update Ticket #{{ ticket.id }}{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-8">

    <h2 class="text-2xl font-semibold mb-8">Update Ticket for {{ ticket.asset.name }}</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Status -->
            <div class="form-group">
                <label>Status</label>
                <select name="status" class="w-full px-4 py-3 border border-gray-300 rounded-xl">
                    <option value="Open" {% if ticket.status == 'Open' %}selected{% endif %}>Open</option>
                    <option value="Assigned" {% if ticket.status == 'Assigned' %}selected{% endif %}>Assigned</option>
                    <option value="In Progress" {% if ticket.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                    <option value="Replacement Required" {% if ticket.status == 'Replacement Required' %}selected{% endif %}>Replacement Required</option>
                    <option value="Resolved" {% if ticket.status == 'Resolved' %}selected{% endif %}>Resolved</option>
                    <option value="Closed" {% if ticket.status == 'Closed' %}selected{% endif %}>Closed</option>
                </select>
            </div>

            <!-- Assigned To -->
            <div class="form-group">
                <label>Assign Technician</label>
                <input type="text" name="assigned_to" value="{{ ticket.assigned_to|default:'' }}" 
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl" 
                       placeholder="Technician Name">
            </div>
        </div>

        <!-- Technician Report -->
        <div class="form-group mt-6">
            <label>Technician Report / Findings</label>
            <textarea name="technician_report" rows="4" 
                      class="w-full px-4 py-3 border border-gray-300 rounded-xl">{{ ticket.technician_report|default:'' }}</textarea>
        </div>

        <!-- Resolution Notes -->
        <div class="form-group mt-6">
            <label>Resolution Notes (if resolved)</label>
            <textarea name="resolution_notes" rows="4" 
                      class="w-full px-4 py-3 border border-gray-300 rounded-xl">{{ ticket.resolution_notes|default:'' }}</textarea>
        </div>

        <!-- Replacement Reason -->
        <div class="form-group mt-6">
            <label>Replacement Reason (if needed)</label>
            <textarea name="replacement_reason" rows="3" 
                      class="w-full px-4 py-3 border border-gray-300 rounded-xl">{{ ticket.replacement_reason|default:'' }}</textarea>
        </div>

        <div class="flex gap-4 mt-10">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3 rounded-xl font-medium">
                Update Ticket
            </button>
            <a href="{% url 'ticket_detail' ticket.pk %}" 
               class="bg-gray-500 hover:bg-gray-600 text-white px-8 py-3 rounded-xl font-medium">
                Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
