{% extends 'assets/base.html' %}
{% block title %}Edit Asset - ICTTrack{% endblock %}
{% block header %}Edit Asset{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-lg p-8">
    <h2 class="text-2xl font-semibold mb-6 flex items-center gap-3">
        <i class="fas fa-edit text-amber-600"></i>
        Edit Asset: {{ asset.name }}
    </h2>

    <form method="POST">
        {% csrf_token %}

        {% for field in form %}
        <div class="form-group">
            <label class="block font-medium mb-2">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}

        <div class="flex gap-4 mt-10">
            <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-8 py-3 rounded-xl font-medium transition">
                <i class="fas fa-save"></i> Update Asset
            </button>
            <a href="{% url 'asset_list' %}" 
               class="bg-gray-500 hover:bg-gray-600 text-white px-8 py-3 rounded-xl font-medium transition">
                Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
